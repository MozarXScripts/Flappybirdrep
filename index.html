<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flappy Bird</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #202a3a;
    font-family: Arial, sans-serif;
  }
  canvas {
    display: block;
    width: min(100vw, 420px);
    height: auto;
    border: 4px solid #17202a;
    border-radius: 8px;
    touch-action: manipulation;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="600" aria-label="Flappy Bird game"></canvas>
<script>
(() => {
  const canvas = document.querySelector("#game");
  const ctx = canvas.getContext("2d");

  const W = canvas.width, H = canvas.height;
  const groundH = 78;
  const bird = { x: 88, y: 270, vy: 0, r: 16, angle: 0 };
  let pipes = [], score = 0, best = 0, state = "ready";
  let tick = 0, groundOffset = 0;

  try { best = Number(localStorage.getItem("flappy-best")) || 0; } catch {}

  function reset() {
    bird.y = 270;
    bird.vy = 0;
    bird.angle = 0;
    pipes = [];
    score = 0;
    tick = 0;
  }

  function action() {
    if (state === "ready" || state === "over") {
      reset();
      state = "playing";
    }
    if (state === "playing") bird.vy = -6.7;
  }

  addEventListener("keydown", e => {
    if (e.code === "Space" || e.code === "ArrowUp") {
      e.preventDefault();
      action();
    }
  });
  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    action();
  });

  function addPipe() {
    const gap = 160;
    const top = 65 + Math.random() * 235;
    pipes.push({ x: W + 10, top, gap, scored: false });
  }

  function drawBackground() {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, "#65c7e8");
    sky.addColorStop(1, "#d3f1d2");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Distant hills
    ctx.fillStyle = "#9bd58c";
    for (let i = 0; i < 5; i++) {
      const x = i * 115 - (groundOffset * 0.22 % 115);
      ctx.beginPath();
      ctx.ellipse(x, 470, 95, 65, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Clouds
    ctx.fillStyle = "rgba(255,255,255,.8)";
    for (const [x0, y] of [[65, 100], [250, 155], [365, 75]]) {
      const x = (x0 - groundOffset * 0.12 % 470 + 470) % 470;
      ctx.beginPath();
      ctx.arc(x, y, 19, 0, Math.PI * 2);
      ctx.arc(x + 22, y - 8, 25, 0, Math.PI * 2);
      ctx.arc(x + 48, y, 18, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPipe(x, y, h, isTop) {
    const w = 62;
    const capH = 24;
    const capY = isTop ? y + h - capH : y;
    const bodyY = isTop ? y : y + capH;
    const bodyH = h - capH;

    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, "#3c9b3d");
    grad.addColorStop(.25, "#73d34c");
    grad.addColorStop(.72, "#54bb43");
    grad.addColorStop(1, "#318839");

    ctx.fillStyle = grad;
    ctx.strokeStyle = "#276b32";
    ctx.lineWidth = 3;
    ctx.fillRect(x + 5, bodyY, w - 10, bodyH);
    ctx.strokeRect(x + 5, bodyY, w - 10, bodyH);
    ctx.fillRect(x, capY, w, capH);
    ctx.strokeRect(x, capY, w, capH);

    ctx.fillStyle = "rgba(255,255,255,.2)";
    ctx.fillRect(x + 12, bodyY + (isTop ? 5 : 0), 7, Math.max(0, bodyH - 5));
  }

  function drawPipes() {
    for (const p of pipes) {
      drawPipe(p.x, 0, p.top, true);
      const lowerY = p.top + p.gap;
      drawPipe(p.x, lowerY, H - groundH - lowerY, false);
    }
  }

  function drawGround() {
    const y = H - groundH;
    ctx.fillStyle = "#ded895";
    ctx.fillRect(0, y, W, groundH);
    ctx.fillStyle = "#79c943";
    ctx.fillRect(0, y, W, 17);
    ctx.fillStyle = "#58a832";
    ctx.fillRect(0, y + 14, W, 5);

    ctx.save();
    ctx.beginPath();
    ctx.rect(0, y + 19, W, groundH - 19);
    ctx.clip();
    ctx.fillStyle = "#c8bd78";
    for (let x = -(groundOffset % 28); x < W; x += 28) {
      ctx.fillRect(x, y + 28, 13, 8);
      ctx.fillRect(x + 12, y + 51, 13, 8);
    }
    ctx.restore();
    ctx.strokeStyle = "#534e39";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(W, y);
    ctx.stroke();
  }

  function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.angle);

    // Tail
    ctx.fillStyle = "#ed8b20";
    ctx.beginPath();
    ctx.moveTo(-12, 1);
    ctx.lineTo(-25, -7);
    ctx.lineTo(-23, 8);
    ctx.closePath();
    ctx.fill();

    // Body
    ctx.fillStyle = "#ffd52a";
    ctx.strokeStyle = "#80521b";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(0, 0, 19, 15, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Wing
    ctx.fillStyle = "#f5a623";
    ctx.beginPath();
    ctx.ellipse(-5, 5 + Math.sin(tick * .35) * 2, 9, 6, -.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Eye
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(8, -6, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "#222";
    ctx.beginPath();
    ctx.arc(10, -6, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Beak
    ctx.fillStyle = "#f47b20";
    ctx.beginPath();
    ctx.moveTo(15, -1);
    ctx.lineTo(29, 3);
    ctx.lineTo(15, 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.restore();
  }

  function text(str, x, y, size, fill = "white") {
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = "center";
    ctx.lineJoin = "round";
    ctx.lineWidth = 5;
    ctx.strokeStyle = "rgba(50,55,40,.8)";
    ctx.strokeText(str, x, y);
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function drawPanel(title, subtitle) {
    ctx.fillStyle = "rgba(38,57,62,.78)";
    ctx.fillRect(35, 190, W - 70, 145);
    ctx.strokeStyle = "rgba(255,255,255,.75)";
    ctx.lineWidth = 3;
    ctx.strokeRect(35, 190, W - 70, 145);
    text(title, W / 2, 238, 34, "#ffe05a");
    text(subtitle, W / 2, 278, 17);
    text("BEST  " + best, W / 2, 310, 16, "#d6f5ff");
  }

  function update() {
    tick++;
    groundOffset += state === "playing" ? 2.7 : 1;

    if (state !== "playing") return;

    bird.vy += 0.36;
    bird.y += bird.vy;
    bird.angle = Math.max(-0.45, Math.min(1.15, bird.vy * .08));

    if (tick % 92 === 0) addPipe();

    for (const p of pipes) {
      p.x -= 2.7;
      if (!p.scored && p.x + 62 < bird.x) {
        p.scored = true;
        score++;
        if (score > best) {
          best = score;
          try { localStorage.setItem("flappy-best", best); } catch {}
        }
      }
    }
    pipes = pipes.filter(p => p.x > -70);

    const groundY = H - groundH;
    const hitGround = bird.y + bird.r >= groundY;
    const hitCeiling = bird.y - bird.r <= 0;
    const hitPipe = pipes.some(p =>
      bird.x + bird.r - 4 > p.x &&
      bird.x - bird.r + 4 < p.x + 62 &&
      (bird.y - bird.r + 4 < p.top ||
       bird.y + bird.r - 4 > p.top + p.gap)
    );

    if (hitGround || hitCeiling || hitPipe) state = "over";
  }

  function render() {
    update();
    drawBackground();
    drawPipes();
    drawGround();
    drawBird();

    if (state === "playing") {
      text(String(score), W / 2, 66, 44);
    } else if (state === "ready") {
      text("FLAPPY BIRD", W / 2, 145, 35, "#ffe05a");
      drawPanel("READY?", "Click, tap, or press SPACE");
      text("Fly through the gaps!", W / 2, 380, 18);
    } else {
      drawPanel("GAME OVER", "Click, tap, or press SPACE");
      text("SCORE  " + score, W / 2, 375, 24, "#ffe05a");
    }

    requestAnimationFrame(render);
  }

  render();
})();
</script>
</body>
</html>
